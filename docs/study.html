<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flash Deck — study</title>
<meta name="description" content="Study your Flash Deck decks in the browser — same decks as the Echo Show, iPhone, watch and Mac.">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #0d1117; --panel: #161d29; --panel2: #1d2635; --line: #2a3548;
    --text: #e8edf5; --dim: #8b98ab; --accent: #4f8ef7;
    --front-bg: #141A26; --back-bg: #0E2A1F;
    --got: #2ea043; --miss: #e5534b;
    --quiz-teal: #40c8e0; --quiz-pink: #ff375f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; background: none; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px 32px; min-height: 100%; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  header img { width: 32px; height: 32px; border-radius: 8px; }
  header h1 { font-size: 20px; margin: 0; flex: 1; }
  .icon-btn { width: 40px; height: 40px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; font-size: 18px; }
  .icon-btn.off { opacity: .45; }
  .muted { color: var(--dim); font-size: 14px; }

  /* deck list */
  .decks { display: grid; gap: 10px; }
  .deck { text-align: left; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; cursor: pointer; }
  .deck:hover { border-color: var(--accent); }
  .deck .test { font-size: 13px; font-weight: 650; color: #fff; background: var(--quiz-teal); padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
  .deck .test:hover { filter: brightness(1.15); }
  .deck .row { display: flex; justify-content: space-between; gap: 12px; }
  .deck .name { font-weight: 650; }
  .bar { height: 6px; border-radius: 3px; background: var(--panel2); margin-top: 10px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

  /* study */
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .top .title { flex: 1; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stage { position: relative; flex: 1; min-height: 360px; display: flex; }
  .card {
    position: relative; flex: 1; border-radius: 20px; border: 1px solid var(--line);
    background: var(--front-bg); padding: 24px; display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center; gap: 14px;
    touch-action: pan-y; user-select: none; cursor: grab; overflow-y: auto;
    transition: transform .25s ease, opacity .25s ease, background .2s;
  }
  .card.back { background: var(--back-bg); }
  .card.dragging { transition: none; cursor: grabbing; }
  .card .side { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .card .text { font-size: clamp(20px, 4.5vw, 28px); font-weight: 600; white-space: pre-wrap; }
  .card .text.long { font-size: 17px; font-weight: 500; text-align: left; }
  .card img, .card video { max-width: 100%; max-height: 50vh; border-radius: 12px; }
  .stamp { position: absolute; top: 18px; padding: 4px 12px; border: 3px solid; border-radius: 8px; font-weight: 800; font-size: 20px; opacity: 0; pointer-events: none; }
  .stamp.got { left: 18px; color: var(--got); transform: rotate(-12deg); }
  .stamp.miss { right: 18px; color: var(--miss); transform: rotate(12deg); }
  .say { position: absolute; right: 12px; bottom: 12px; }
  .progress { height: 4px; background: var(--panel2); border-radius: 2px; margin-bottom: 12px; overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
  .controls { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; margin-top: 14px; }
  .controls button { padding: 14px 8px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-weight: 600; }
  .controls .miss { color: var(--miss); }
  .controls .got { color: var(--got); }
  .keys { text-align: center; margin-top: 10px; }
  .done { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; }
  .done .big { font-size: 44px; font-weight: 800; }
  .primary { background: var(--accent) !important; color: #fff; padding: 12px 20px; border-radius: 12px; font-weight: 650; }
  /* practice test (same tiles as the iPhone / Mac / watch) */
  .quiz { flex: 1; display: flex; flex-direction: column; }
  .points { display: flex; justify-content: space-between; font-weight: 650; font-size: 15px; margin-bottom: 8px; }
  .progress.pink > i { background: var(--quiz-pink); }
  .prompt { font-size: 18px; font-weight: 500; text-align: center; white-space: pre-wrap; padding: 12px 4px 16px; }
  .pick { text-align: center; font-size: 13px; font-weight: 650; color: var(--dim); margin-bottom: 8px; }
  .tiles { display: grid; gap: 10px; }
  .tile {
    display: flex; align-items: center; gap: 10px; text-align: left; width: 100%;
    color: #fff; padding: 14px; border-radius: 8px; font-size: 16px; line-height: 1.35;
    box-shadow: inset 0 0 0 0 #fff; transition: opacity .2s, box-shadow .15s;
  }
  .tile span { flex: 1; white-space: pre-wrap; }
  .tile .mark { flex: 0; font-size: 20px; }
  .tile.picked { box-shadow: inset 0 0 0 3px #fff; }
  .tile:not(.locked):hover { filter: brightness(1.08); }
  .tile.locked { cursor: default; }
  .next-row { display: flex; justify-content: flex-end; margin-top: 16px; }
  .next { width: 52px; height: 52px; border-radius: 50%; background: var(--quiz-teal); color: #fff; font-size: 22px; font-weight: 800; display: grid; place-items: center; }
  .next:disabled { opacity: .35; cursor: default; }
  .explain { margin-top: 14px; padding: 14px; border-radius: 10px; font-size: 15px; line-height: 1.4; display: grid; gap: 8px; }
  .explain.right { background: rgba(48, 209, 88, .14); }
  .explain.wrong { background: rgba(255, 69, 58, .14); }
  .explain h3 { margin: 0; font-size: 17px; }
  .explain.right h3 { color: var(--got); }
  .explain.wrong h3 { color: var(--miss); }
  .explain b { display: block; white-space: pre-wrap; }
  .explain .doubt { color: #ff9f0a; font-size: 13px; }
  .ask { margin-top: 12px; padding: 14px; border-radius: 10px; background: rgba(64, 200, 224, .12); display: grid; gap: 8px; font-size: 15px; line-height: 1.4; }
  .ask b { display: block; }
  .ask form { display: flex; gap: 8px; }
  .ask input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: inherit; font: inherit; }
  .ask button, .ask-open { color: var(--quiz-teal); font-weight: 650; }
  .ask-open { margin-top: 12px; text-align: left; }
  .icon-btn.auto { font-size: 15px; font-weight: 800; }
  .done .pct { font-size: 20px; }
  .done .pct.pass { color: var(--got); }
  .done .pct.fail { color: #ff9f0a; }
  .secondary { background: var(--panel) !important; border: 1px solid var(--line) !important; padding: 12px 20px; border-radius: 12px; font-weight: 650; }
  .secondary.red { color: var(--miss); }
  .error { background: #3a1d1d; border: 1px solid var(--miss); padding: 12px; border-radius: 12px; }
  @media (max-width: 480px) { .keys { display: none; } .controls button { padding: 14px 4px; font-size: 15px; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// contents API first: always fresh, so a deck imported a moment ago shows up (raw is CDN-cached ~5 min)
const SOURCES = [
  ['https://api.github.com/repos/AssiamahS/flashdeck/contents/decks.json?ref=main', { headers: { Accept: 'application/vnd.github.raw+json' } }],
  ['https://raw.githubusercontent.com/AssiamahS/flashdeck/main/decks.json', { cache: 'no-store' }],
  ['https://cdn.jsdelivr.net/gh/AssiamahS/flashdeck@main/decks.json', {}],
];
const app = document.getElementById('app');
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
// Leitner boxes 1-5 keyed by deck id + card front, same grading as the apps
let boxes = store.get('fd.boxes', {});
let speak = store.get('fd.speak', true);
let autoNext = store.get('fd.autoNext', true); // practice test: move on by itself after a right answer
let decks = [];
let s = null; // study session
let q = null; // practice test session

const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const key = (deck, card) => deck.id + '|' + card.front;
const box = (deck, card) => boxes[key(deck, card)] || 1;
const mastered = deck => deck.cards.filter(c => box(deck, c) >= 5).length;
const climb = deck => deck.cards.length ? deck.cards.reduce((n, c) => n + box(deck, c) - 1, 0) / (deck.cards.length * 4) : 0;

function say(text, onend) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  // each line ("A. …") becomes a short pause, like the apps
  const t = String(text || '').split('\n').map(l => l.trim()).filter(Boolean).join(', ').replace(/\s+/g, ' ').replace(/\.$/, '').trim();
  if (!t) return;
  const u = new SpeechSynthesisUtterance(t);
  if (onend) u.onend = onend;
  // Chrome/Safari drop an utterance queued in the same tick as cancel()
  setTimeout(() => speechSynthesis.speak(u), 60);
}

async function load() {
  app.innerHTML = '<p class="muted">Loading decks…</p>';
  for (const [url, opts] of SOURCES) {
    try {
      const res = await fetch(url, opts);
      if (!res.ok) continue;
      decks = (await res.json()).decks.filter(d => d.cards?.length);
      return home();
    } catch {}
  }
  app.innerHTML = '<div class="error">Couldn\'t load decks.json from GitHub. Check your connection and reload.</div>';
}

function speakerButton() {
  return `<button class="icon-btn ${speak ? '' : 'off'}" id="speak" title="Read cards aloud" aria-label="Read cards aloud">${speak ? '🔊' : '🔇'}</button>`;
}
function bindSpeaker(after) {
  document.getElementById('speak').onclick = () => {
    speak = !speak; store.set('fd.speak', speak);
    if (!speak && 'speechSynthesis' in window) speechSynthesis.cancel();
    after();
  };
}

function home() {
  s = null; q = null;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  document.onkeydown = null;
  app.innerHTML = `
    <header>
      <img src="https://cdn.jsdelivr.net/gh/AssiamahS/flashdeck@main/media/icons/icon108.png" alt="">
      <h1>Flash Deck</h1>
      ${speakerButton()}
    </header>
    <p class="muted" style="margin:0 0 14px">Same decks as the Echo Show, iPhone, watch and Mac. Progress on the web is saved in this browser.</p>
    <div class="decks">${decks.map((d, i) => `
      <div class="deck" data-i="${i}" role="button" tabindex="0">
        <div class="row"><span class="name">${esc(d.name)}</span><span class="muted">${d.cards.length} cards</span></div>
        <div class="row muted" style="margin-top:2px"><span>${mastered(d)} mastered</span><span>${Math.round(climb(d) * 100)}%</span></div>
        <div class="bar"><i style="width:${climb(d) * 100}%"></i></div>
        ${canQuiz(d) ? `<div class="row" style="margin-top:10px;justify-content:flex-end"><button class="test" data-i="${i}">Practice test</button></div>` : ''}
      </div>`).join('')}
    </div>
    <p class="muted" style="margin-top:20px"><a href="install.html" style="color:var(--accent)">Get the iPhone / Mac app</a> · <a href="import.html" style="color:var(--accent)">Import from Quizlet</a> · <a href="editor.html" style="color:var(--accent)">Edit decks</a></p>`;
  bindSpeaker(home);
  app.querySelectorAll('.deck').forEach(b => {
    b.onclick = () => study(decks[+b.dataset.i]);
    b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); study(decks[+b.dataset.i]); } };
  });
  app.querySelectorAll('.test').forEach(b => b.onclick = e => { e.stopPropagation(); quiz(decks[+b.dataset.i]); });
}

function study(deck) {
  // lowest boxes (least known) first, ties shuffled
  const queue = deck.cards.map(c => [c, box(deck, c), Math.random()])
    .sort((a, b) => a[1] - b[1] || a[2] - b[2]).map(x => x[0]);
  q = null;
  s = { deck, queue, i: 0, flipped: false, got: 0, missed: 0, history: [] };
  document.onkeydown = onKey;
  render(true);
}

function media(card) {
  const img = s.flipped && card.backImage ? card.backImage : card.image;
  let html = '';
  if (img) html += `<img src="${esc(img)}" alt="" draggable="false">`;
  if (card.video && !s.flipped) html += `<video src="${esc(card.video)}" autoplay loop muted playsinline></video>`;
  return html;
}

function render(announce) {
  if (s.i >= s.queue.length) return finished();
  const card = s.queue[s.i];
  const text = s.flipped ? card.back : card.front;
  app.innerHTML = `
    <div class="top">
      <button class="icon-btn" id="back" aria-label="Back to decks">‹</button>
      <span class="title">${esc(s.deck.name)}</span>
      <span class="muted">${s.i + 1} / ${s.queue.length}</span>
      ${speakerButton()}
    </div>
    <div class="progress"><i style="width:${s.i / s.queue.length * 100}%"></i></div>
    <div class="stage">
      <div class="card ${s.flipped ? 'back' : ''}" id="card">
        <span class="stamp got">GOT IT</span><span class="stamp miss">MISSED</span>
        <span class="side">${s.flipped ? 'Answer' : 'Question'} · box ${box(s.deck, card)}</span>
        ${media(card)}
        <div class="text ${String(text).length > 160 ? 'long' : ''}">${esc(text)}</div>
        <span class="muted">${s.flipped ? 'Swipe right if you got it, left if you missed' : 'Tap to flip'}</span>
        <button class="icon-btn say" id="say" aria-label="Read this card">🗣</button>
      </div>
    </div>
    <div class="controls">
      <button class="miss" id="miss">✗ Missed</button>
      <button id="undo" ${s.history.length ? '' : 'disabled style="opacity:.4"'}>↶ Undo</button>
      <button id="skip">Skip</button>
      <button class="got" id="got">✓ Got it</button>
    </div>
    <p class="muted keys">Space/↑ flip · ↓ skip · ← missed · → got it · Z undo</p>`;
  document.getElementById('back').onclick = home;
  bindSpeaker(() => render(false));
  document.getElementById('say').onclick = e => { e.stopPropagation(); say(text); };
  document.getElementById('miss').onclick = () => grade(false);
  document.getElementById('got').onclick = () => grade(true);
  document.getElementById('skip').onclick = skip;
  document.getElementById('undo').onclick = undo;
  bindSwipe(document.getElementById('card'));
  if (announce && speak) say(text);
}

function bindSwipe(el) {
  let x0 = null, y0 = 0, dx = 0, moved = false;
  el.onpointerdown = e => {
    if (e.target.closest('button')) return;
    x0 = e.clientX; y0 = e.clientY; dx = 0; moved = false;
    el.setPointerCapture(e.pointerId); el.classList.add('dragging');
  };
  el.onpointermove = e => {
    if (x0 == null) return;
    dx = e.clientX - x0;
    if (Math.abs(dx) > 8 || Math.abs(e.clientY - y0) > 8) moved = true;
    el.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)`;
    el.querySelector('.stamp.got').style.opacity = Math.max(0, Math.min(1, dx / 100));
    el.querySelector('.stamp.miss').style.opacity = Math.max(0, Math.min(1, -dx / 100));
  };
  const end = () => {
    if (x0 == null) return;
    x0 = null; el.classList.remove('dragging');
    if (Math.abs(dx) > 110) return grade(dx > 0, dx > 0 ? 1 : -1);
    el.style.transform = '';
    el.querySelectorAll('.stamp').forEach(st => st.style.opacity = 0);
    if (!moved) flip();
  };
  el.onpointerup = end;
  el.onpointercancel = end;
}

function flip() {
  s.flipped = !s.flipped;
  render(true); // read the side that's now showing — question again when flipping back
}

function gradeBox(deck, card, got) {
  const k = key(deck, card);
  boxes[k] = got ? Math.min(box(deck, card) + 1, 5) : 1;
  store.set('fd.boxes', boxes);
}

function grade(got, dir) {
  const card = s.queue[s.i], k = key(s.deck, card);
  s.history.push({ i: s.i, k, prev: boxes[k], got });
  gradeBox(s.deck, card, got);
  got ? s.got++ : s.missed++;
  advance(dir ?? (got ? 1 : -1));
}

function skip() {
  s.history.push({ i: s.i, skip: true });
  advance(0);
}

function advance(dir) {
  const el = document.getElementById('card');
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  const next = () => { s.i++; s.flipped = false; render(true); };
  if (!el || !dir) return next();
  el.style.transform = `translateX(${dir * 120}%) rotate(${dir * 18}deg)`;
  el.style.opacity = 0;
  setTimeout(next, 220);
}

function undo() {
  const h = s.history.pop();
  if (!h) return;
  if (!h.skip) {
    if (h.prev == null) delete boxes[h.k]; else boxes[h.k] = h.prev;
    store.set('fd.boxes', boxes);
    h.got ? s.got-- : s.missed--;
  }
  s.i = h.i; s.flipped = false;
  render(true);
}

function finished() {
  const total = s.got + s.missed;
  app.innerHTML = `
    <div class="top"><button class="icon-btn" id="back" aria-label="Back to decks">‹</button><span class="title">${esc(s.deck.name)}</span></div>
    <div class="done">
      <div class="big">${total ? Math.round(s.got / total * 100) : 0}%</div>
      <div>${s.got} got it · ${s.missed} missed</div>
      <div class="muted">${mastered(s.deck)} of ${s.deck.cards.length} cards mastered</div>
      <button class="primary" id="again">Study again</button>
    </div>`;
  document.getElementById('back').onclick = home;
  document.getElementById('again').onclick = () => study(s.deck);
  if (speak) say(`${s.got} got it, ${s.missed} missed`);
}

function onKey(e) {
  if (q) return onQuizKey(e);
  if (!s || s.i >= s.queue.length || e.metaKey || e.ctrlKey || e.altKey) return;
  const act = { ' ': flip, ArrowUp: flip, ArrowDown: skip, ArrowLeft: () => grade(false), ArrowRight: () => grade(true), z: undo, Escape: home }[e.key];
  if (act) { e.preventDefault(); act(); }
}

// ---------- practice test (port of ios/FlashDeck/Quiz.swift + QuizView.swift) ----------
const PALETTE = ['#40c8e0', '#30d158', '#ff9f0a', '#ff453a', '#bf5af2', '#0a84ff', '#ff375f', '#5e5ce6'];
const ASK_URL = 'https://flashdeck-relay.sylvesterassiamahpm.workers.dev/explain';
const OPTION_LINE = /^([A-H])\.\s*(.+)$/;
const textOnly = c => !c.image && !c.backImage && !c.video;
const canQuiz = deck => deck.cards.length >= 3 && deck.cards.some(textOnly);

// "A. …" lines in the front are the options, "A. …" lines in the back are the answer key.
function lettered(card) {
  const prompt = [], options = [];
  for (const raw of String(card.front).split('\n')) {
    const line = raw.trim(), m = line.match(OPTION_LINE);
    if (m) options.push({ letter: m[1], text: m[2] });
    else if (!options.length) prompt.push(line);
    else if (line) options[options.length - 1].text += ' ' + line; // wrapped option text
  }
  if (options.length < 2) return null;
  const answers = String(card.back).split('\n').map(l => (l.trim().match(OPTION_LINE) || [])[1]).filter(Boolean);
  const correct = new Set(options.map((o, i) => answers.includes(o.letter) ? i : -1).filter(i => i >= 0));
  if (!correct.size) return null;
  return { card, prompt: prompt.join('\n').trim(), options: options.map(o => o.text), letters: options.map(o => o.letter), correct };
}

// term → pick the right back out of four, distractors from the rest of the deck
function borrowed(card, pool) {
  const answer = String(card.back).trim();
  if (!answer || !card.front) return null;
  const others = shuffle([...new Set(pool.filter(b => b && b !== answer))]).slice(0, 3);
  if (others.length < 2) return null;
  const options = shuffle([...others, answer]);
  return { card, prompt: card.front, options, letters: [], correct: new Set([options.indexOf(answer)]) };
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function buildQuestions(deck) {
  const pool = deck.cards.map(c => String(c.back).trim());
  return deck.cards.flatMap(card => {
    if (!textOnly(card)) return [];
    const l = lettered(card);
    if (l) return [l];
    // lettered front whose answer key didn't parse: skip rather than guess
    const letteredLines = String(card.front).split('\n').filter(x => OPTION_LINE.test(x.trim())).length;
    const b = letteredLines >= 2 ? null : borrowed(card, pool);
    return b ? [b] : [];
  });
}

// weakest Leitner box first, shuffled within each box so tests don't repeat
const orderedQuestions = deck => buildQuestions(deck).map(x => [x, box(deck, x.card), Math.random()])
  .sort((a, b) => a[1] - b[1] || a[2] - b[2]).map(x => x[0]);

function quiz(deck) {
  s = null;
  q = { deck };
  startQuiz(orderedQuestions(deck));
  document.onkeydown = onKey;
}

function startQuiz(list) {
  Object.assign(q, { questions: list, i: 0, picked: new Set(), checked: false, points: 0, missed: [], asks: null });
  renderQuiz();
  readQuestion();
}

const optLabel = (qu, i) => qu.letters[i] ? `${qu.letters[i]}. ${qu.options[i]}` : qu.options[i];
const answerLabel = (qu, sep) => [...qu.correct].sort((a, b) => a - b).map(i => optLabel(qu, i)).join(sep);
const wrongPicks = qu => [...q.picked].filter(i => !qu.correct.has(i)).sort((a, b) => a - b);
const whyNot = (qu, i) => qu.card.whyNot?.[qu.letters[i]];

function readQuestion() {
  if (!speak) return;
  const qu = q.questions?.[q.i];
  if (qu) say([qu.prompt, ...qu.options.map((_, i) => optLabel(qu, i))].join('\n'));
}

// green "what you got right" or red "why that was wrong", plus the key's reason
function explanation(qu) {
  const right = q.picked.size === qu.correct.size && [...q.picked].every(i => qu.correct.has(i));
  const answer = answerLabel(qu, '\n');
  return `<div class="explain ${right ? 'right' : 'wrong'}" id="quizExplanation">
    <h3>${right ? '✓ Correct' : '✗ Not quite'}</h3>
    ${right ? '' : wrongPicks(qu).map(i => `<div><b>You picked ${esc(optLabel(qu, i))}</b>${whyNot(qu, i) ? esc(whyNot(qu, i)) : ''}</div>`).join('')}
    <div><b>${right ? '' : 'Answer: '}${esc(answer)}</b>${qu.card.why ? esc(qu.card.why) : ''}</div>
    ${qu.card.keyDoubt ? `<div class="doubt">⚠ ${esc(qu.card.keyDoubt)}</div>` : ''}
  </div>`;
}

// "Ask about this": follow-ups on the question on screen, answered by the relay Worker (Workers AI)
function askBox() {
  if (!q.asks) return `<button class="ask-open" id="askOpen">💬 Ask about this question</button>`;
  return `<div class="ask">
    ${q.asks.map(t => `<div><b>${esc(t.ask)}</b>${esc(t.answer ?? '…')}</div>`).join('')}
    <form id="askForm"><input id="askField" placeholder="e.g. what's the difference between RPO and RTO?" autocomplete="off" ${q.asking ? 'disabled' : ''}><button aria-label="Send">Ask</button></form>
  </div>`;
}

function bindAsk(qu) {
  const open = document.getElementById('askOpen');
  if (open) open.onclick = () => { q.asks = []; renderQuiz(); document.getElementById('askField').focus(); };
  const form = document.getElementById('askForm');
  if (!form) return;
  const field = document.getElementById('askField');
  field.onkeydown = e => e.stopPropagation(); // typing must not pick tiles or hit Enter = next
  form.onsubmit = async e => {
    e.preventDefault();
    const ask = field.value.trim();
    if (!ask || q.asking) return;
    const at = q.i, turn = { ask };
    const history = q.asks.filter(t => t.answer).map(t => ({ ask: t.ask, answer: t.answer }));
    q.asks.push(turn); q.asking = true; renderQuiz();
    try {
      const res = await fetch(ASK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
        question: [qu.prompt, ...qu.options.map((_, i) => optLabel(qu, i))].join('\n'),
        answer: answerLabel(qu, ', '), picked: [...q.picked].sort().map(i => optLabel(qu, i)).join(', '),
        why: qu.card.why || '', ask, history }) });
      const j = await res.json();
      turn.answer = j.answer || j.error || 'No answer — try again.';
    } catch { turn.answer = 'Couldn’t reach the tutor — check your connection.'; }
    q.asking = false;
    if (q.i !== at) return;
    renderQuiz();
    document.getElementById('askField')?.focus();
    if (speak) say(turn.answer);
  };
}

function verdict(qu, right) {
  const lines = [right ? `Correct. ${answerLabel(qu, ', and ')}` : 'Wrong.'];
  if (!right) {
    for (const i of wrongPicks(qu)) lines.push(`You picked ${optLabel(qu, i)}`, whyNot(qu, i) || '');
    lines.push(`The answer is ${answerLabel(qu, ', and ')}`);
  }
  if (qu.card.why) lines.push(qu.card.why);
  return lines.join('\n');
}

function renderQuiz() {
  if (!q.questions.length) {
    app.innerHTML = `
      <div class="top"><button class="icon-btn" id="back" aria-label="Back to decks">‹</button><span class="title">${esc(q.deck.name)}</span></div>
      <div class="done"><div class="big">No questions</div><div class="muted">This deck has no text cards to quiz on.</div></div>`;
    document.getElementById('back').onclick = home;
    return;
  }
  if (q.i >= q.questions.length) return quizSummary();
  const qu = q.questions[q.i], done = q.i + (q.checked ? 1 : 0), need = qu.correct.size;
  const ready = q.checked || q.picked.size === need;
  app.innerHTML = `
    <div class="top">
      <button class="icon-btn" id="back" aria-label="Back to decks">‹</button>
      <span class="title">${esc(q.deck.name)}</span>
      <span class="muted">${q.i + 1} / ${q.questions.length}</span>
      <button class="icon-btn auto ${autoNext ? '' : 'off'}" id="auto" title="Auto-next after a right answer" aria-label="Auto-next after a right answer" aria-pressed="${autoNext}">${autoNext ? '⏩' : '⏸'}</button>
      ${speakerButton()}
    </div>
    <div class="points"><span id="quizPoints">Points: ${q.points}/${done}</span></div>
    <div class="progress pink"><i style="width:${done / q.questions.length * 100}%"></i></div>
    <div class="quiz">
      <div class="prompt">${esc(qu.prompt)}</div>
      ${need > 1 && !q.checked ? `<div class="pick">Pick ${need}</div>` : ''}
      <div class="tiles">${qu.options.map((opt, i) => {
        const right = qu.correct.has(i), picked = q.picked.has(i);
        const mark = q.checked && right ? '✓' : q.checked && picked ? '✗' : picked ? '●' : '';
        return `<button class="tile ${picked ? 'picked' : ''} ${q.checked ? 'locked' : ''}"
          style="background:${PALETTE[i % PALETTE.length]}" data-i="${i}" aria-pressed="${picked}">
          <span>${esc(optLabel(qu, i))}</span>${mark ? `<b class="mark">${mark}</b>` : ''}</button>`;
      }).join('')}</div>
      ${q.checked ? explanation(qu) + askBox() : ''}
      <div class="next-row"><button class="next" id="next" ${ready ? '' : 'disabled'} aria-label="${q.checked ? 'Next' : 'Check'}">${q.checked ? '→' : '✓'}</button></div>
      <p class="muted keys">${qu.letters.length ? 'A-' + qu.letters.at(-1) : '1-' + qu.options.length} pick · Enter ${q.checked ? 'next' : 'check'} · Esc decks</p>
    </div>`;
  document.getElementById('back').onclick = home;
  bindSpeaker(() => { renderQuiz(); readQuestion(); });
  bindAsk(qu);
  document.getElementById('auto').onclick = () => { autoNext = !autoNext; store.set('fd.autoNext', autoNext); renderQuiz(); };
  document.getElementById('next').onclick = () => q.checked ? quizAdvance() : quizCheck();
  app.querySelectorAll('.tile').forEach(t => t.onclick = () => pickOption(+t.dataset.i));
}

function pickOption(i) {
  if (q.checked) return;
  const qu = q.questions[q.i], need = qu.correct.size;
  if (q.picked.has(i)) q.picked.delete(i);
  else if (need === 1) { q.picked = new Set([i]); return quizCheck(); }
  else if (q.picked.size < need) q.picked.add(i);
  renderQuiz();
}

function quizCheck() {
  const qu = q.questions[q.i];
  if (q.checked || q.picked.size !== qu.correct.size) return;
  q.checked = true;
  const right = [...q.picked].every(i => qu.correct.has(i));
  if (right) q.points++; else q.missed.push(qu);
  gradeBox(q.deck, qu.card, right);
  renderQuiz();
  // auto-next waits for the verdict to be read out, or 1.5 s when muted
  const at = q.i, next = () => { if (right && autoNext && q && q.i === at && q.checked && !q.asks) quizAdvance(); };
  if (speak && 'speechSynthesis' in window) say(verdict(qu, right), next);
  else setTimeout(next, 1500);
}

function quizAdvance() {
  q.i++; q.picked = new Set(); q.checked = false; q.asks = null;
  renderQuiz();
  if (q.i < q.questions.length) readQuestion();
}

function quizSummary() {
  const n = q.questions.length, pct = Math.round(q.points / n * 100), pass = q.points * 100 >= n * 85;
  app.innerHTML = `
    <div class="top"><button class="icon-btn" id="back" aria-label="Back to decks">‹</button><span class="title">${esc(q.deck.name)}</span></div>
    <div class="done">
      <div class="big">${q.points}/${n}</div>
      <div class="pct ${pass ? 'pass' : 'fail'}">${pct}% correct</div>
      <div class="muted">Aim for 85% before booking the exam.</div>
      <div style="height:12px"></div>
      ${q.missed.length ? `<button class="secondary red" id="retry">Retry the ${q.missed.length} missed</button>` : ''}
      <button class="primary" id="again">New test</button>
    </div>`;
  document.getElementById('back').onclick = home;
  document.getElementById('again').onclick = () => startQuiz(orderedQuestions(q.deck));
  const r = document.getElementById('retry');
  if (r) r.onclick = () => startQuiz(shuffle([...q.missed]));
  if (speak) say(`${q.points} out of ${n}, ${pct} percent`);
}

function onQuizKey(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape') { e.preventDefault(); return home(); }
  if (!q.questions || q.i >= q.questions.length) return;
  if (e.key === 'Enter') { e.preventDefault(); return q.checked ? quizAdvance() : quizCheck(); }
  const qu = q.questions[q.i], n = parseInt(e.key, 10), l = qu.letters.indexOf(e.key.toUpperCase());
  if (n >= 1 && n <= qu.options.length) { e.preventDefault(); pickOption(n - 1); }
  else if (l >= 0) { e.preventDefault(); pickOption(l); }
}

load();
</script>
</body>
</html>
