name: FlashDeck
options:
  bundleIdPrefix: com.djsly
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: QGMAWHX827
    MARKETING_VERSION: 1.7.1
    CURRENT_PROJECT_VERSION: 1
targets:
  FlashDeck:
    type: application
    platform: iOS
    sources:
      - path: FlashDeck
    dependencies:
      - target: FlashDeckWatch
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.djsly.flashdeck
      CODE_SIGN_STYLE: Automatic
      TARGETED_DEVICE_FAMILY: 1
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SUPPORTS_XR_DESIGNED_FOR: NO
    info:
      path: FlashDeck/Resources/Info.plist
      properties:
        CFBundleName: FlashDeck
        CFBundleDisplayName: Flash Deck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        FlashDeckGitHubToken: $(FLASHDECK_GITHUB_TOKEN)
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    scheme:
      testTargets:
        - FlashDeckUITests
  FlashDeckWatch:
    type: application
    platform: watchOS
    sources:
      - path: FlashDeckWatch
      - path: FlashDeck/Models.swift
      - path: FlashDeck/LeitnerSync.swift
      - path: FlashDeck/ImageURL.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.djsly.flashdeck.watchkitapp
      CODE_SIGN_STYLE: Automatic
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: FlashDeckWatch/Resources/Info.plist
      properties:
        CFBundleName: FlashDeck
        CFBundleDisplayName: Flash Deck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.djsly.flashdeck
        WKRunsIndependentlyOfCompanionApp: true
  FlashDeckMac:
    # Same SwiftUI app on the Mac; iPhone-only bits are behind PlatformShims / #if os(iOS).
    type: application
    platform: macOS
    sources:
      - path: FlashDeck
        excludes:
          - "Resources/**"
          - "Assets.xcassets/**"
      - path: FlashDeckMac
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.djsly.flashdeck.mac
      PRODUCT_NAME: Flash Deck
      CODE_SIGN_STYLE: Automatic
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_HARDENED_RUNTIME: NO
      COMBINE_HIDPI_IMAGES: YES
    info:
      path: FlashDeckMac/Info.plist
      properties:
        CFBundleName: FlashDeck
        CFBundleDisplayName: Flash Deck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.education
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        FlashDeckGitHubToken: $(FLASHDECK_GITHUB_TOKEN)
  FlashDeckUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FlashDeckUITests
    dependencies:
      - target: FlashDeck
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.djsly.flashdeck.uitests
      TEST_TARGET_NAME: FlashDeck
      GENERATE_INFOPLIST_FILE: YES
