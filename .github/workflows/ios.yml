name: iOS

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: ios

jobs:
  build:
    name: Build (unsigned compile check)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project FlashDeck.xcodeproj \
            -scheme FlashDeck \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

  screenshots:
    name: App Store screenshots (simulator)
    runs-on: macos-26
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: UI test with screenshots
        run: |
          set -o pipefail
          xcodebuild test \
            -project FlashDeck.xcodeproj \
            -scheme FlashDeck \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' \
            -resultBundlePath build/ui.xcresult
      - name: Export attachments
        run: |
          xcrun xcresulttool export attachments --path build/ui.xcresult --output-path build/shots
          ls -la build/shots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ios/build/shots

  adhoc:
    # USB sideload lane: signed IPA for registered devices, no App Store / TestFlight involved.
    # Watch app is left out here (ad-hoc profiles need a registered watch UDID); TestFlight carries it.
    name: Ad-hoc IPA (sideload)
    runs-on: macos-26
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc" "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"
          cp "$RUNNER_TEMP/asc/AuthKey.p8" "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project (iPhone only)
        run: |
          sed -i '' "s/^    CURRENT_PROJECT_VERSION: .*/    CURRENT_PROJECT_VERSION: $GITHUB_RUN_NUMBER/" project.yml
          sed -i '' '/^    dependencies:$/{N;/FlashDeckWatch/d;}' project.yml
          xcodegen generate
      - name: Archive (unsigned — export does the cloud signing)
        env:
          FLASHDECK_GITHUB_TOKEN: ${{ secrets.FLASHDECK_GITHUB_TOKEN }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project FlashDeck.xcodeproj \
            -scheme FlashDeck \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FlashDeck.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER \
            FLASHDECK_GITHUB_TOKEN="$FLASHDECK_GITHUB_TOKEN"
      - name: Export ad-hoc IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/FlashDeck.xcarchive \
            -exportOptionsPlist ExportOptionsAdHoc.plist \
            -exportPath build/adhoc \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la build/adhoc
      - uses: actions/upload-artifact@v4
        with:
          name: FlashDeck-adhoc-ipa
          path: ios/build/adhoc/*.ipa
      - name: Publish install page (docs/ → GitHub Pages)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' ios/build/FlashDeck.xcarchive/Products/Applications/FlashDeck.app/Info.plist)
          mkdir -p docs/ipa
          cp ios/build/adhoc/*.ipa docs/ipa/FlashDeck.ipa
          sed -i '' -E "s#<key>bundle-version</key><string>[^<]*</string>#<key>bundle-version</key><string>${VERSION}</string>#" docs/ipa/manifest.plist
          sed -i '' -E "s/Build [0-9]+ \(v[^)]*\) · [0-9-]+ ·/Build $GITHUB_RUN_NUMBER (v$VERSION) · $(date -u +%Y-%m-%d) ·/" docs/install.html
          git checkout -- ios/project.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ipa docs/install.html
          git commit -m "build: ad hoc IPA build $GITHUB_RUN_NUMBER (v$VERSION)" || exit 0
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          # Pages here is the legacy /docs build; a bot push may not trigger it, so request one
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null || true

  testflight:
    name: Sign & upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 45
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Check for App Store Connect credentials
        id: creds
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ASC secrets not set — skipping TestFlight upload"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write App Store Connect API key
        if: steps.creds.outputs.have == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc" "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"
          cp "$RUNNER_TEMP/asc/AuthKey.p8" "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Install XcodeGen
        if: steps.creds.outputs.have == 'true'
        run: brew install xcodegen

      - name: Generate Xcode project
        if: steps.creds.outputs.have == 'true'
        run: |
          sed -i '' "s/^    CURRENT_PROJECT_VERSION: .*/    CURRENT_PROJECT_VERSION: $GITHUB_RUN_NUMBER/" project.yml
          xcodegen generate

      - name: Archive (unsigned — export does the cloud signing)
        if: steps.creds.outputs.have == 'true'
        env:
          FLASHDECK_GITHUB_TOKEN: ${{ secrets.FLASHDECK_GITHUB_TOKEN }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project FlashDeck.xcodeproj \
            -scheme FlashDeck \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FlashDeck.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER \
            FLASHDECK_GITHUB_TOKEN="$FLASHDECK_GITHUB_TOKEN"

      - name: Export & upload to App Store Connect
        if: steps.creds.outputs.have == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/FlashDeck.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
